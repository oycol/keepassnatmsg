name: Recover KeePass E2E Runner State
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recover:
    runs-on: [self-hosted, windows, keepass-e2e, interactive, chrome]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify retained pre-test state
        shell: powershell
        run: |
          $state = Join-Path $env:RUNNER_TEMP 'keepassnatmsg-e2e-preserve\state.json'
          if (-not (Test-Path -LiteralPath $state)) { throw 'No retained backup found; do not guess original registry values' }
          & "$PWD\scripts\e2e-preserve-runner.ps1" -Action Restore
          if (Test-Path -LiteralPath $state) { throw 'Restoration not verified; backup retained' }
          Write-Host 'Runner state restored and read back; retained backup cleared.'
