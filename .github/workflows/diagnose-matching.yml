name: Diagnose Matching

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose KeePassNatMsg Matching (redacted)
    runs-on: [self-hosted, windows, keepass-e2e, interactive]
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Recover retained E2E backup before any browser probes
        if: false
        shell: powershell
        run: |
          $state = Join-Path $env:LOCALAPPDATA 'keepassnatmsg-e2e-preserve\state.json'
          if (-not (Test-Path -LiteralPath $state)) { throw 'No retained backup found; do not guess original registry values' }
          & "$PWD\scripts\e2e-preserve-runner.ps1" -Action Restore
          if (Test-Path -LiteralPath $state) { throw 'Restoration not verified; backup retained' }
          Write-Host 'Runner original state restored and verified.'

      - name: Repair broken HKCU host registrations to existing verified manifest
        shell: powershell
        run: |
          $manifest = Join-Path $env:LOCALAPPDATA 'KeePassNatMsg\org.keepassxc.keepassxc_browser.json'
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'Manifest absent; refusing to repair registry' }
          $m = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          $origins = @($m.allowed_origins)
          if ($m.name -ne 'org.keepassxc.keepassxc_browser' -or -not (Test-Path -LiteralPath $m.path) -or
              'chrome-extension://pdffhmdngciaglkoonimfcmckehcpafo/' -notin $origins -or
              'chrome-extension://oboonakemofpalcgghocfoadofidjkkk/' -notin $origins -or $origins.Count -ne 2) { throw 'Manifest is not verified standard installation' }
          foreach ($key in @('HKCU:\Software\Google\Chrome\NativeMessagingHosts\org.keepassxc.keepassxc_browser', 'HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\org.keepassxc.keepassxc_browser')) {
            New-Item -Path $key -Force | Out-Null
            Set-Item -LiteralPath $key -Value $manifest -ErrorAction Stop
            if ((Get-Item -LiteralPath $key).GetValue('') -cne $manifest) { throw 'Host registry repair read-back failed' }
          }
          Write-Host 'Chrome and Edge host registry values repaired to existing verified manifest and read back.'

      - name: Read-only integration state after failed restoration
        shell: powershell
        run: |
          $manifest = Join-Path $env:LOCALAPPDATA 'KeePassNatMsg\org.keepassxc.keepassxc_browser.json'
          $keys = @('HKCU:\Software\Google\Chrome\NativeMessagingHosts\org.keepassxc.keepassxc_browser','HKCU:\Software\Microsoft\Edge\NativeMessagingHosts\org.keepassxc.keepassxc_browser')
          Write-Host "manifest_present=$(Test-Path -LiteralPath $manifest) keepass_running=$([bool](Get-Process KeePass -ErrorAction SilentlyContinue))"
          if (Test-Path -LiteralPath $manifest) {
            $m = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
            $origins = @($m.allowed_origins)
            $defaults = @('chrome-extension://pdffhmdngciaglkoonimfcmckehcpafo/','chrome-extension://oboonakemofpalcgghocfoadofidjkkk/')
            Write-Host "manifest_name_ok=$($m.name -eq 'org.keepassxc.keepassxc_browser') default_origins_present=$($defaults[0] -in $origins -and $defaults[1] -in $origins) unexpected_origins=$(@($origins | Where-Object { $_ -notin $defaults }).Count) proxy_exists=$(Test-Path -LiteralPath $m.path)"
          }
          for ($i=0; $i -lt $keys.Count; $i++) {
            $exists = Test-Path -LiteralPath $keys[$i]
            $value = if ($exists) { (Get-Item -LiteralPath $keys[$i]).GetValue('') } else { $null }
            $resolved = if ($value) { [Environment]::ExpandEnvironmentVariables([string]$value).Trim('"') } else { '' }
            Write-Host "registry_$i-present=$exists points_to_current_manifest=$($exists -and $value -eq $manifest) equivalent_path=$($exists -and $resolved -ieq $manifest) target_exists=$([bool]($resolved -and (Test-Path -LiteralPath $resolved))) target_name_expected=$([bool]($resolved -and [IO.Path]::GetFileName($resolved) -eq 'org.keepassxc.keepassxc_browser.json'))"
          }
          $roots = @($env:RUNNER_TEMP, (Join-Path $env:TEMP 'keepassnatmsg-e2e-preserve'), (Join-Path $env:LOCALAPPDATA 'keepassnatmsg-e2e-preserve'))
          foreach ($root in $roots) {
            Write-Host "candidate_backup_root_exists=$(Test-Path -LiteralPath $root) candidate_state_exists=$(Test-Path -LiteralPath (Join-Path $root 'state.json'))"
          }
          # Do not scan arbitrary user directories or publish the registry values.

      - name: Check diagnostic availability without exposing logs or credentials
        shell: powershell
        run: |
          $logPath = Join-Path $env:LOCALAPPDATA 'KeePassNatMsg\plugin.log'
          $proxyLog = Join-Path $env:LOCALAPPDATA 'KeePassNatMsg\proxy.log'
          $kpCfg = Join-Path $env:APPDATA 'KeePass\KeePass.config.xml'
          $dbPath = 'C:\KeePassNatMsg-E2E\test.kdbx'
          Write-Host "plugin.log present: $(Test-Path $logPath)"
          Write-Host "proxy.log present: $(Test-Path $proxyLog)"
          Write-Host "KeePass config present: $(Test-Path $kpCfg)"
          Write-Host "Test database present: $(Test-Path $dbPath)"
          Write-Host 'No raw logs, config values, database entries, URLs, usernames, or credentials are published.'
          Write-Host 'Matching behavior and browser-origin communication remain UNVERIFIED by this diagnostic.'

      - name: Probe isolated runner prerequisites without opening user data
        if: false
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          $extensionDir = 'C:\KeePassNatMsg-E2E\extension'
          $manifestPath = Join-Path $extensionDir 'manifest.json'
          $manifest = if (Test-Path $manifestPath) { Get-Content $manifestPath -Raw | ConvertFrom-Json } else { $null }
          $archive = Join-Path $env:TEMP 'kpxc-browser.zip'
          $archiveHash = if (Test-Path $archive) { (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() } else { '(missing)' }
          $chromeProfile = 'C:\KeePassNatMsg-E2E\chrome-user-data'
          $running = @(Get-Process KeePass, chrome -ErrorAction SilentlyContinue | Select-Object -ExpandProperty ProcessName -Unique)
          Write-Host "Interactive=$([Environment]::UserInteractive); session=$env:SESSIONNAME"
          Write-Host "Screen=$($screen.Bounds.Width)x$($screen.Bounds.Height); working=$($screen.WorkingArea.Width)x$($screen.WorkingArea.Height)"
          Write-Host "Extension directory present=$(Test-Path $extensionDir); manifest version=$($manifest.version); manifest has key=$([bool]$manifest.key)"
          Write-Host "Cached extension ZIP SHA256=$archiveHash"
          Write-Host "E2E browser profile present=$(Test-Path $chromeProfile); active app names=$($running -join ',')"
          $chrome = @('C:\Program Files\Google\Chrome\Application\chrome.exe','C:\Program Files (x86)\Google\Chrome\Application\chrome.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($chrome) { Write-Host "Chrome version=$((Get-Item $chrome).VersionInfo.ProductVersion)" }
          $pwBrowsers = Join-Path $env:LOCALAPPDATA 'ms-playwright'
          Write-Host "Playwright browser cache present=$(Test-Path $pwBrowsers)"
          $chromium = @('C:\Program Files\Chromium\Application\chrome.exe','C:\Program Files (x86)\Chromium\Application\chrome.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          Write-Host "Standalone Chromium installed=$([bool]$chromium)"
          $chromeProcesses = @(Get-CimInstance Win32_Process -Filter "name='chrome.exe'" | Select-Object -First 3 -ExpandProperty ExecutablePath -Unique)
          Write-Host "Existing Chrome executable paths=$($chromeProcesses -join ',')"
      - name: Install isolated Playwright Chromium
        if: false
        shell: powershell
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:TEMP 'keepass-playwright-browsers'
          $pkg = Join-Path $env:TEMP 'keepass-playwright-cli'
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          npm install --prefix $pkg playwright@1.58.2 --no-save --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Playwright install failed' }
          & (Join-Path $pkg 'node_modules\.bin\playwright.cmd') install chromium
          if ($LASTEXITCODE -ne 0) { throw 'Isolated Chromium install failed' }
      - name: Probe isolated official browser extension
        if: false
        shell: powershell
        run: |
          $extension = Join-Path $env:TEMP 'keepass-probe-extension'
          if (Test-Path $extension) { Remove-Item $extension -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $extension | Out-Null
          try {
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $env:TEMP 'kpxc-browser.zip'), $extension)
            $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:TEMP 'keepass-playwright-browsers'
            node "$PWD\scripts\probe-browser-extension.js" $extension "$PWD\e2e-artifacts"
            if ($LASTEXITCODE -ne 0) { throw 'Official extension did not load in isolated Chromium' }
          } finally {
            Remove-Item $extension -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Upload sanitized probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-probe
          path: e2e-artifacts/extension-probe.json
          retention-days: 7
          if-no-files-found: ignore
