name: Windows Interactive E2E

on:
  workflow_dispatch:
    inputs:
      run_fla_ui:
        description: 'Run FlaUI KeePass desktop UI tests'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_playwright:
        description: 'Run Playwright Chrome/KeePassXC-Browser tests'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  e2e:
    name: Chrome Native Messaging E2E
    runs-on: [self-hosted, windows, keepass-e2e, interactive, chrome]
    timeout-minutes: 60

    env:
      HTTP_PROXY: http://192.168.8.100:7897
      HTTPS_PROXY: http://192.168.8.100:7897
      ALL_PROXY: http://192.168.8.100:7897
      E2E_OUTPUT_DIR: e2e-artifacts
      KEEPASS_E2E_DIR: C:\KeePassNatMsg-E2E

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact directories
        run: |
          New-Item -ItemType Directory -Force -Path $env:E2E_OUTPUT_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:KEEPASS_E2E_DIR | Out-Null

      - name: Ensure test environment software (Chrome and KeePass)
        run: |
          [System.Net.WebRequest]::DefaultWebProxy = New-Object System.Net.WebProxy($env:HTTP_PROXY)
          Write-Host "Checking Chrome and KeePass..."
          $chromePath = @(
            'C:\Program Files\Google\Chrome\Application\chrome.exe',
            'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $chromePath) {
            Write-Host "Chrome not found, installing Chrome..."
            $chromeInstaller = "$env:TEMP\ChromeSetup.exe"
            Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $chromeInstaller
            Start-Process -FilePath $chromeInstaller -ArgumentList "/silent /install" -Wait
          }

          $kpPath = @(
            'C:\Program Files\KeePass Password Safe 2\KeePass.exe',
            'C:\Program Files (x86)\KeePass Password Safe 2\KeePass.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $kpPath) {
            Write-Host "KeePass not found, installing KeePass 2.60 from release asset..."
            $kpInstaller = "$env:TEMP\KeePass-2.60-Setup.exe"
            Invoke-WebRequest -Uri "https://github.com/oycol/keepassnatmsg/releases/download/v2.1.0/kp-setup-test.exe" -OutFile $kpInstaller
            Start-Process -FilePath $kpInstaller -ArgumentList "/VERYSILENT /NORESTART /SUPPRESSMSGBOXES" -Wait
          }

      - name: Collect environment diagnostics
        run: |
          $diag = [ordered]@{
            timestamp = (Get-Date).ToString('o')
            user = [Environment]::UserName
            machine = [Environment]::MachineName
            interactive = [Environment]::UserInteractive
            os = (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber)
            chrome = @(
              'C:\Program Files\Google\Chrome\Application\chrome.exe',
              'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            keepass = @(
              'C:\Program Files\KeePass Password Safe 2\KeePass.exe',
              'C:\Program Files (x86)\KeePass Password Safe 2\KeePass.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            localAppData = $env:LOCALAPPDATA
            nativeHostKey = 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\org.keepassxc.keepassxc_browser'
            nativeHostRegistryExists = Test-Path 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\org.keepassxc.keepassxc_browser'
            tools = [ordered]@{
              git = [bool](Get-Command git -ErrorAction SilentlyContinue)
              dotnet = [bool](Get-Command dotnet -ErrorAction SilentlyContinue)
              node = [bool](Get-Command node -ErrorAction SilentlyContinue)
              msbuild = [bool](Get-Command msbuild -ErrorAction SilentlyContinue)
              winget = [bool](Get-Command winget -ErrorAction SilentlyContinue)
            }
          }
          $diag | ConvertTo-Json -Depth 8 | Set-Content "$env:E2E_OUTPUT_DIR\diagnostics.json" -Encoding UTF8
          Get-Content "$env:E2E_OUTPUT_DIR\diagnostics.json"

      - name: Deploy Plugin and Run Real Windows Chrome Integration E2E
        run: |
          Write-Host "=== Step 1: Download latest compiled KeePassNatMsg.plgx from CI artifacts ===" -ForegroundColor Cyan
          $pluginsDir = "C:\Program Files\KeePass Password Safe 2\Plugins"
          New-Item -ItemType Directory -Force -Path $pluginsDir | Out-Null

          # Download the fresh .plgx artifact from latest release or build locally
          $buildDir = "$env:TEMP\kpnm-ci-build"
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null
          
          # We can download KeePassNatMsg.dll and .plgx from GitHub API/releases or build directly
          $releaseUrl = "https://github.com/oycol/keepassnatmsg/releases/download/v2.1.0"
          Write-Host "Getting build binaries..."
          # Since the runner workspace already has the full repo checked out in $PWD,
          # copy KeePass.exe to build directory for project reference
          New-Item -ItemType Directory -Force -Path "$PWD\build" | Out-Null
          if (Test-Path "C:\Program Files\KeePass Password Safe 2\KeePass.exe") {
            Copy-Item "C:\Program Files\KeePass Password Safe 2\KeePass.exe" "$PWD\build\KeePass.exe" -Force
          }
          Write-Host "Runner workspace: $PWD"
          # Try build with MSBuild or dotnet
          $msbuild = Get-Command msbuild -ErrorAction SilentlyContinue
          if (-not $msbuild) {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
              if ($vsPath -and (Test-Path "$vsPath\MSBuild\Current\Bin\MSBuild.exe")) {
                $msbuild = "$vsPath\MSBuild\Current\Bin\MSBuild.exe"
              }
            }
          }

          if ($msbuild) {
            Write-Host "Building fresh KeePassNatMsg.dll with MSBuild..."
            & $msbuild KeePassNatMsg\KeePassNatMsg.csproj /p:Configuration=Release /verbosity:minimal
            Copy-Item "KeePassNatMsg\bin\Release\*" $buildDir -Recurse -Force
          } else {
            # Fallback to dotnet build
            Write-Host "Building fresh KeePassNatMsg.dll with dotnet build..."
            dotnet build KeePassNatMsg\KeePassNatMsg.csproj -c Release -o $buildDir
          }

          # 1.5 Compile robust NativeProxy.exe on Windows test host
          $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          $robustProxy = "$PWD\KeePassNatMsg\Resources\keepassnatmsg-proxy.exe"
          Write-Host "Compiling robust native 64-bit keepassnatmsg-proxy.exe..."
          & $csc /nologo /target:exe /optimize+ /out:$robustProxy "$PWD\scripts\NativeProxy.cs"
          $proxyHash = (Get-FileHash $robustProxy -Algorithm SHA256).Hash.ToLower()
          Write-Host "New keepassnatmsg-proxy.exe SHA256: $proxyHash" -ForegroundColor Green

          # Copy to config dir for testing
          $configDir = "$env:LOCALAPPDATA\KeePassNatMsg"
          New-Item -ItemType Directory -Force -Path $configDir | Out-Null
          Copy-Item $robustProxy "$configDir\keepassnatmsg-proxy.exe" -Force

          # Also create .plgx using the installed KeePass.exe
          $kpExe = "C:\Program Files\KeePass Password Safe 2\KeePass.exe"
          if (Test-Path $kpExe) {
            Write-Host "Building fresh .plgx using KeePass.exe..."
            $p = Start-Process -FilePath $kpExe -ArgumentList "--plgx-create","$PWD\KeePassNatMsg" -PassThru
            $p.WaitForExit()
            if (Test-Path "KeePassNatMsg.plgx") {
              Copy-Item "KeePassNatMsg.plgx" "$buildDir\KeePassNatMsg.plgx" -Force
            }
          }

          $ciPlgx = "$buildDir\KeePassNatMsg.plgx"
          if (Test-Path $ciPlgx) {
            $targetPlgx = Join-Path $pluginsDir "KeePassNatMsg.plgx"
            Copy-Item $ciPlgx $targetPlgx -Force
            Write-Host "Deployed fresh plugin .plgx to: $targetPlgx" -ForegroundColor Green
          }

          $ciDll = "$buildDir\KeePassNatMsg.dll"
          if (Test-Path $ciDll) {
            $targetDll = Join-Path $pluginsDir "KeePassNatMsg.dll"
            Copy-Item $ciDll $targetDll -Force
            Write-Host "Deployed fresh plugin .dll to: $targetDll" -ForegroundColor Green
          }

          Write-Host "`n=== Step 2: Test Native Messaging Host & Registry Configuration ===" -ForegroundColor Cyan
          $configDir = "$env:LOCALAPPDATA\KeePassNatMsg"
          $proxyPath = "$configDir\keepassnatmsg-proxy.exe"
          $manifestPath = "$configDir\org.keepassxc.keepassxc_browser.chrome.json"
          $regKey = "HKCU:\Software\Google\Chrome\NativeMessagingHosts\org.keepassxc.keepassxc_browser"

          # Compile and load ChromeIntegrationService directly via Add-Type
          $sourceFile = "$PWD\KeePassNatMsg\NativeMessaging\ChromeIntegrationService.cs"
          Add-Type -Path $sourceFile
          $service = New-Object KeePassNatMsg.NativeMessaging.ChromeIntegrationService

          Write-Host "Initial status before install:"
          $s1 = $service.CheckStatus()
          Write-Host "  State: $($s1.State) - $($s1.Message)"

          Write-Host "`nExecuting InstallOrRepair()..."
          $err = $null
          $ok = $service.InstallOrRepair([ref]$err)
          if (-not $ok) { throw "InstallOrRepair failed: $err" }
          Write-Host "InstallOrRepair returned true!" -ForegroundColor Green

          Write-Host "`nValidating filesystem and registry state:"
          if (-not (Test-Path $proxyPath)) { throw "Proxy exe does not exist at: $proxyPath" }
          $proxyHash = (Get-FileHash $proxyPath -Algorithm SHA256).Hash.ToLower()
          Write-Host "  Proxy Path: $proxyPath (SHA256: $proxyHash)"
          if ($proxyHash -ne [KeePassNatMsg.NativeMessaging.ChromeIntegrationService]::ExpectedProxySha256) {
            throw "Proxy SHA256 mismatch! Got: $proxyHash"
          }

          if (-not (Test-Path $manifestPath)) { throw "Manifest file does not exist at: $manifestPath" }
          $manifestContent = Get-Content $manifestPath -Raw
          Write-Host "  Manifest JSON Content:`n$manifestContent"
          if (-not ($manifestContent -match "obcddimikignkfpophjabdkdggkodnnh")) {
            throw "Manifest does not contain Chrome extension origin!"
          }

          if (-not (Test-Path $regKey)) { throw "Registry key does not exist: $regKey" }
          $regVal = (Get-ItemProperty -Path $regKey).'(default)'
          Write-Host "  Registry Value: $regVal"
          if ($regVal -ne $manifestPath) {
            throw "Registry value does not point to manifest path!"
          }

          $s2 = $service.CheckStatus()
          Write-Host "`nVerified Status after install: $($s2.State) (Ready)" -ForegroundColor Green
          if ($s2.State -ne [KeePassNatMsg.NativeMessaging.ChromeIntegrationState]::Ready) {
            throw "Expected state Ready, but got: $($s2.State)"
          }

          Write-Host "`n=== Step 3: Test Uninstall & Clean Up ===" -ForegroundColor Cyan
          $service.Uninstall([ref]$err)
          if (Test-Path $regKey) { throw "Registry key should be removed after uninstall!" }
          if (Test-Path $manifestPath) { throw "Manifest should be removed after uninstall!" }
          Write-Host "Uninstall successfully cleaned up registry and manifest." -ForegroundColor Green

          Write-Host "`n=== Step 4: Re-install for final ready state ===" -ForegroundColor Cyan
          $service.InstallOrRepair([ref]$err)
          $s3 = $service.CheckStatus()
          if ($s3.State -ne [KeePassNatMsg.NativeMessaging.ChromeIntegrationState]::Ready) {
            throw "Failed to re-install integration into Ready state!"
          }
          Write-Host "Chrome Integration is 100% verified and READY for Chrome!" -ForegroundColor Green

          Write-Host "`n=== Step 5: Test KeePass Startup & Named Pipe with Plugin ===" -ForegroundColor Cyan
          $kpExe = "C:\Program Files\KeePass Password Safe 2\KeePass.exe"

          # 5.1 Download & deploy KeePassXC-Browser extension to C:\KeePassNatMsg-E2E\extension
          $extDir = "C:\KeePassNatMsg-E2E\extension"
          if (-not (Test-Path "$extDir\manifest.json")) {
            New-Item -ItemType Directory -Force -Path $extDir | Out-Null
            $extZip = "$env:TEMP\kpxc-browser.zip"
            if (-not (Test-Path $extZip)) {
              Invoke-WebRequest -Uri "https://github.com/oycol/keepassnatmsg/releases/download/v2.2.0/kpxc-browser.zip" -OutFile $extZip
            }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory($extZip, $extDir)
            Write-Host "KeePassXC-Browser 1.10.4 unpacked to: $extDir" -ForegroundColor Green
          } else {
            Write-Host "KeePassXC-Browser extension already unpacked at: $extDir" -ForegroundColor Green
          }

          # 5.2 Create dedicated test database with a credential entry
          $testDbPath = "C:\KeePassNatMsg-E2E\test.kdbx"
          $testDbPass = "TestPassword2026!"
          if (-not (Test-Path $testDbPath)) {
            Write-Host "Creating test database: $testDbPath"
            [System.Reflection.Assembly]::LoadFrom($kpExe) | Out-Null
            $db = New-Object KeePassLib.PwDatabase
            $io = New-Object KeePassLib.Serialization.IOConnectionInfo
            $io.Path = $testDbPath
            $compKey = New-Object KeePassLib.Keys.CompositeKey
            $passKey = New-Object KeePassLib.Keys.KcpPassword($testDbPass)
            $compKey.AddUserKey($passKey)
            $db.New($io, $compKey)

            $entry = New-Object KeePassLib.PwEntry($true, $true)
            $entry.Strings.Set("Title", (New-Object KeePassLib.Security.ProtectedString($false, "Example Site")))
            $entry.Strings.Set("UserName", (New-Object KeePassLib.Security.ProtectedString($false, "admin_tester")))
            $entry.Strings.Set("Password", (New-Object KeePassLib.Security.ProtectedString($true, "MySuperSecretPassword2026!")))
            $entry.Strings.Set("URL", (New-Object KeePassLib.Security.ProtectedString($false, "https://example.com/")))
            $db.RootGroup.AddEntry($entry, $true)
            $db.Save($null)
            $db.Close()
            Write-Host "Test database created with entry for https://example.com/" -ForegroundColor Green
          } else {
            Write-Host "Test database already exists at: $testDbPath" -ForegroundColor Green
          }

          # 5.3 Launch KeePass and open test.kdbx
          Write-Host "Launching KeePass with test database..."
          $kpProc = Start-Process -FilePath $kpExe -ArgumentList "`"$testDbPath`" -pw:$testDbPass" -PassThru
          Start-Sleep -Seconds 4
          if ($kpProc.HasExited) {
            throw "KeePass process exited unexpectedly on startup!"
          }
          Write-Host "KeePass is running with test.kdbx unlocked (PID: $($kpProc.Id))." -ForegroundColor Green

          # 5.4 Check Named Pipe created by KeePassNatMsg for proxy communication
          $pipes = [System.IO.Directory]::GetFiles('\\.\pipe\') | Where-Object { $_ -match "keepass" }
          Write-Host "Active KeePass pipes:"
          $pipes | ForEach-Object { Write-Host "  $_" -ForegroundColor Green }

          # 5.5 Execute direct Named Pipe protocol roundtrip test
          Write-Host "`nRunning direct Named Pipe protocol roundtrip test..." -ForegroundColor Cyan
          & powershell -ExecutionPolicy Bypass -File "$PWD\scripts\test-direct-pipe.ps1"
          if ($LASTEXITCODE -ne 0) {
            throw "Direct Named Pipe test failed with exit code $LASTEXITCODE"
          }

          # 5.6 Test launching Chrome with extension loaded and open extension options page
          $chromeExe = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          $chromeUserData = "C:\KeePassNatMsg-E2E\chrome-user-data"
          Write-Host "Launching Chrome with KeePassXC-Browser extension..."
          $chromeProc = Start-Process -FilePath $chromeExe -ArgumentList "--user-data-dir=`"$chromeUserData`" --load-extension=`"$extDir`" chrome-extension://obcddimikignkfpophjabdkdggkodnnh/options/options.html https://example.com/" -PassThru
          Start-Sleep -Seconds 8
          Write-Host "Chrome is running with extension loaded (PID: $($chromeProc.Id))." -ForegroundColor Green

          # Clean up processes
          Stop-Process -Id $chromeProc.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $kpProc.Id -Force -ErrorAction SilentlyContinue
          Write-Host "KeePass and Chrome test processes closed cleanly." -ForegroundColor Green

          # 5.7 Inspect diagnostic logs
          $proxyLog = "$env:LOCALAPPDATA\KeePassNatMsg\proxy.log"
          if (Test-Path $proxyLog) {
            Write-Host "`n=== Proxy Diagnostic Log ===" -ForegroundColor Yellow
            Get-Content $proxyLog | ForEach-Object { Write-Host "  $_" }
          }
          $pluginLog = "$env:LOCALAPPDATA\KeePassNatMsg\plugin.log"
          if (Test-Path $pluginLog) {
            Write-Host "`n=== Plugin Diagnostic Log ===" -ForegroundColor Yellow
            Get-Content $pluginLog | ForEach-Object { Write-Host "  $_" }
          }

          Write-Host "`n=== All Windows E2E Integration and IPC Protocol Tests PASSED! ===" -ForegroundColor Green
