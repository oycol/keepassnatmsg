name: Windows Interactive E2E

on:
  workflow_dispatch:
    inputs:
      run_fla_ui:
        description: 'Run FlaUI KeePass desktop UI tests'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      run_playwright:
        description: 'Run Playwright Chrome/KeePassXC-Browser tests'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

defaults:
  run:
    shell: powershell

jobs:
  e2e:
    name: Chrome Native Messaging E2E
    runs-on: [self-hosted, windows, keepass-e2e, interactive, chrome]
    timeout-minutes: 60

    env:
      E2E_OUTPUT_DIR: e2e-artifacts
      KEEPASS_E2E_DIR: C:\KeePassNatMsg-E2E

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact directories
        run: |
          New-Item -ItemType Directory -Force -Path $env:E2E_OUTPUT_DIR | Out-Null
          New-Item -ItemType Directory -Force -Path $env:KEEPASS_E2E_DIR | Out-Null

      - name: Ensure test environment software (Chrome and KeePass)
        run: |
          Write-Host "Checking Chrome and KeePass..."
          $chromePath = @(
            'C:\Program Files\Google\Chrome\Application\chrome.exe',
            'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $chromePath) {
            Write-Host "Chrome not found, installing Chrome..."
            $chromeInstaller = "$env:TEMP\ChromeSetup.exe"
            Invoke-WebRequest -Uri "https://dl.google.com/chrome/install/latest/chrome_installer.exe" -OutFile $chromeInstaller
            Start-Process -FilePath $chromeInstaller -ArgumentList "/silent /install" -Wait
          }

          $kpPath = @(
            'C:\Program Files\KeePass Password Safe 2\KeePass.exe',
            'C:\Program Files (x86)\KeePass Password Safe 2\KeePass.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $kpPath) {
            Write-Host "KeePass not found, installing via winget..."
            if (Get-Command winget -ErrorAction SilentlyContinue) {
              winget install -e --id DominikReichl.KeePass --accept-package-agreements --accept-source-agreements --silent
            }
            # Recheck after winget
            $kpPath = @(
              'C:\Program Files\KeePass Password Safe 2\KeePass.exe',
              'C:\Program Files (x86)\KeePass Password Safe 2\KeePass.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1

            if (-not $kpPath) {
              Write-Host "Winget failed or pending, downloading portable KeePass..."
              $kpDir = "C:\Program Files\KeePass Password Safe 2"
              New-Item -ItemType Directory -Force -Path $kpDir | Out-Null
              $kpZip = "$env:TEMP\KeePass-2.60.zip"
              Invoke-WebRequest -Uri "https://master.dl.sourceforge.net/project/keepass/KeePass%202.x/2.60/KeePass-2.60.zip" -OutFile $kpZip
              Add-Type -AssemblyName System.IO.Compression.FileSystem
              [System.IO.Compression.ZipFile]::ExtractToDirectory($kpZip, $kpDir)
            }
          }

      - name: Collect environment diagnostics
        run: |
          $diag = [ordered]@{
            timestamp = (Get-Date).ToString('o')
            user = [Environment]::UserName
            machine = [Environment]::MachineName
            interactive = [Environment]::UserInteractive
            os = (Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber)
            chrome = @(
              'C:\Program Files\Google\Chrome\Application\chrome.exe',
              'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            keepass = @(
              'C:\Program Files\KeePass Password Safe 2\KeePass.exe',
              'C:\Program Files (x86)\KeePass Password Safe 2\KeePass.exe'
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            localAppData = $env:LOCALAPPDATA
            nativeHostKey = 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\org.keepassxc.keepassxc_browser'
            nativeHostRegistryExists = Test-Path 'HKCU:\Software\Google\Chrome\NativeMessagingHosts\org.keepassxc.keepassxc_browser'
            tools = [ordered]@{
              git = [bool](Get-Command git -ErrorAction SilentlyContinue)
              dotnet = [bool](Get-Command dotnet -ErrorAction SilentlyContinue)
              node = [bool](Get-Command node -ErrorAction SilentlyContinue)
              msbuild = [bool](Get-Command msbuild -ErrorAction SilentlyContinue)
              winget = [bool](Get-Command winget -ErrorAction SilentlyContinue)
            }
          }
          $diag | ConvertTo-Json -Depth 8 | Set-Content "$env:E2E_OUTPUT_DIR\diagnostics.json" -Encoding UTF8
          Get-Content "$env:E2E_OUTPUT_DIR\diagnostics.json"

      - name: Build solution for E2E host
        run: |
          $msbuild = Get-Command msbuild -ErrorAction SilentlyContinue
          if (-not $msbuild) {
            # Try locate VS / BuildTools MSBuild
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPath = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
              if ($vsPath -and (Test-Path "$vsPath\MSBuild\Current\Bin\MSBuild.exe")) {
                $msbuildPath = "$vsPath\MSBuild\Current\Bin\MSBuild.exe"
                Write-Host "Found MSBuild via vswhere: $msbuildPath"
                & $msbuildPath /p:Configuration=Release /verbosity:minimal
                return
              }
            }
            Write-Warning 'MSBuild not found on runner PATH or standard VS locations.'
          } else {
            msbuild /p:Configuration=Release /verbosity:minimal
          }

      - name: Run FlaUI KeePass desktop UI tests
        if: ${{ inputs.run_fla_ui == 'true' }}
        run: |
          if (Test-Path 'KeePassNatMsg.E2E.Tests\KeePassNatMsg.E2E.Tests.csproj') {
            dotnet test KeePassNatMsg.E2E.Tests\KeePassNatMsg.E2E.Tests.csproj --logger "trx;LogFileName=flaui-e2e.trx" --results-directory $env:E2E_OUTPUT_DIR
          } else {
            Write-Warning 'KeePassNatMsg.E2E.Tests project not present yet; skipping until v2.2.0 implementation adds it.'
          }

      - name: Run Playwright Chrome E2E tests
        if: ${{ inputs.run_playwright == 'true' }}
        run: |
          if (Test-Path 'e2e\package.json') {
            Push-Location e2e
            npm ci
            npx playwright install chromium
            npx playwright test --reporter=line,json --output="..\$env:E2E_OUTPUT_DIR\playwright-output"
            Pop-Location
          } else {
            Write-Warning 'e2e/package.json not present yet; skipping until v2.2.0 implementation adds it.'
          }

      - name: Upload E2E artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-interactive-e2e
          path: e2e-artifacts\
          if-no-files-found: ignore
          retention-days: 14
